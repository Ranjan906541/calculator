
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app">
    <section class="calculator">
      <header class="calc-header">
        <div>
          <p class="eyebrow">CODEALPHA INTERNSHIP</p>
          <h1>Calculator</h1>
        </div>
        <div class="calc-icon">✳</div>
      </header>

      <div class="display">
        <div id="expression" class="expression">Ready to calculate</div>
        <output id="result" class="result"
                aria-live="polite">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete">DEL</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key utility" data-action="sign">+/−</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>

      <p class="keyboard-hint">
        Tip: You can also use your keyboard
      </p>
    </section>

    <footer>Built with HTML, CSS & JavaScript</footer>
  </main>

</body>
</html>
